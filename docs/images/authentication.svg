<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="498" rx="16" fill="#F7F9FC" stroke="#D0D7E2" stroke-width="2"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1F2A44">Authentication: challenge–response</text>
  <text x="30" y="62" font-size="13" fill="#5A6478">The phone proves it holds the shared key without ever sending it</text>

  <!-- Shared key band -->
  <rect x="150" y="80" width="600" height="30" rx="15" fill="#FBEED9" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="450" y="100" font-size="13" fill="#8A6A17" text-anchor="middle">🔑 Shared secret key — hard-coded in the ESP32, entered once in the app. Never transmitted.</text>

  <!-- Lifelines -->
  <g>
    <rect x="130" y="128" width="180" height="40" rx="8" fill="#DCE8FB" stroke="#2F6FDE" stroke-width="2"/>
    <text x="220" y="153" font-size="15" font-weight="700" fill="#1F2A44" text-anchor="middle">Phone (app)</text>
    <line x1="220" y1="168" x2="220" y2="470" stroke="#9AA6B8" stroke-width="2" stroke-dasharray="4 4"/>

    <rect x="590" y="128" width="180" height="40" rx="8" fill="#E3E8F0" stroke="#1F2A44" stroke-width="2"/>
    <text x="680" y="153" font-size="15" font-weight="700" fill="#1F2A44" text-anchor="middle">ESP32 (telescope)</text>
    <line x1="680" y1="168" x2="680" y2="470" stroke="#9AA6B8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Step 0: ESP32 self note -->
  <rect x="560" y="186" width="240" height="40" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
  <text x="680" y="203" font-size="12" fill="#1F2A44" text-anchor="middle">Generates a new random challenge</text>
  <text x="680" y="219" font-size="12" fill="#1F2A44" text-anchor="middle">every 5 minutes</text>

  <!-- Step 1: read -->
  <line x1="220" y1="252" x2="676" y2="252" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <text x="235" y="245" font-size="12.5" fill="#1F2A44">① Read the authentication characteristic</text>

  <!-- Step 2: challenge -->
  <line x1="680" y1="288" x2="224" y2="288" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <text x="664" y="281" font-size="12.5" fill="#1F2A44" text-anchor="end">② Challenge C (random)</text>

  <!-- Step 3: phone computes -->
  <rect x="100" y="306" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="1.5"/>
  <text x="250" y="323" font-size="12.5" fill="#1F2A44" text-anchor="middle">③ response = HMAC-SHA256(key, C)</text>
  <text x="250" y="339" font-size="11" fill="#5A6478" text-anchor="middle">a fingerprint of C, computed with the key</text>

  <!-- Step 4: send response -->
  <line x1="220" y1="372" x2="676" y2="372" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="235" y="365" font-size="12.5" fill="#2E9E6B">④ Response</text>

  <!-- Step 5: ESP32 compares -->
  <rect x="520" y="390" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
  <text x="670" y="407" font-size="12.5" fill="#1F2A44" text-anchor="middle">⑤ Compare with its own</text>
  <text x="670" y="423" font-size="12.5" fill="#1F2A44" text-anchor="middle">HMAC-SHA256(key, C)</text>

  <!-- Step 6: grant/refuse -->
  <line x1="680" y1="456" x2="224" y2="456" stroke="#C0392B" stroke-width="2" marker-end="url(#red)"/>
  <text x="664" y="449" font-size="12.5" fill="#C0392B" text-anchor="end">⑥ Match → connection granted · otherwise refused</text>
</svg>
