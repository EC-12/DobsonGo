<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/>
    </marker>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="588" rx="16" fill="#F7F9FC" stroke="#D0D7E2" stroke-width="2"/>
  <line x1="300" y1="30" x2="300" y2="565" stroke="#D0D7E2" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="600" y1="30" x2="600" y2="565" stroke="#D0D7E2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Titles -->
  <g font-size="20" font-weight="700" fill="#1F2A44">
    <text x="30" y="44">Solid tube</text>
    <text x="320" y="44">Truss tube (assembled)</text>
    <text x="620" y="44">Truss tube (taken apart)</text>
  </g>

  <!-- Ground -->
  <g stroke="#B8C0CC" stroke-width="2">
    <line x1="30" y1="470" x2="280" y2="470"/>
    <line x1="320" y1="470" x2="580" y2="470"/>
    <line x1="620" y1="470" x2="880" y2="470"/>
  </g>

  <!-- ===================== A: Solid tube ===================== -->
  <rect x="110" y="100" width="80" height="345" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5"/>
  <rect x="107" y="96" width="86" height="10" rx="2" fill="#1F2A44"/>
  <rect x="190" y="132" width="14" height="16" fill="#C9D2DF" stroke="#1F2A44" stroke-width="1.5"/>
  <rect x="80" y="456" width="140" height="13" rx="3" fill="#C49A6C" stroke="#7A5530" stroke-width="2"/>
  <path d="M90 456 L90 380 L120 380 A30 30 0 0 0 180 380 L210 380 L210 456 Z" fill="#D9B382" stroke="#7A5530" stroke-width="2"/>
  <circle cx="150" cy="380" r="28" fill="#E9D3B0" stroke="#7A5530" stroke-width="2.5"/>
  <!-- Height -->
  <line x1="62" y1="102" x2="62" y2="466" stroke="#5A6478" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text transform="translate(50,284) rotate(-90)" font-size="13" fill="#5A6478" text-anchor="middle">can be 1.2 m tall or more</text>

  <!-- ===================== B: Truss tube, assembled ===================== -->
  <!-- Light shroud -->
  <path d="M407 332 L493 332 L489 143 L411 143 Z" fill="#1F2A44" fill-opacity="0.10" stroke="#1F2A44" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Mirror box -->
  <rect x="405" y="330" width="90" height="112" fill="#E3E8F0" stroke="#1F2A44" stroke-width="2.5"/>
  <!-- Truss poles -->
  <g stroke="#5A6478" stroke-width="4" stroke-linecap="round">
    <line x1="410" y1="332" x2="424" y2="145"/>
    <line x1="446" y1="332" x2="424" y2="145"/>
    <line x1="454" y1="332" x2="476" y2="145"/>
    <line x1="490" y1="332" x2="476" y2="145"/>
  </g>
  <!-- Upper cage -->
  <rect x="410" y="110" width="80" height="34" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5"/>
  <rect x="407" y="106" width="86" height="9" rx="2" fill="#1F2A44"/>
  <rect x="490" y="118" width="14" height="16" fill="#C9D2DF" stroke="#1F2A44" stroke-width="1.5"/>
  <!-- Rocker -->
  <rect x="380" y="456" width="140" height="13" rx="3" fill="#C49A6C" stroke="#7A5530" stroke-width="2"/>
  <path d="M390 456 L390 380 L420 380 A30 30 0 0 0 480 380 L510 380 L510 456 Z" fill="#D9B382" stroke="#7A5530" stroke-width="2"/>
  <circle cx="450" cy="380" r="28" fill="#E9D3B0" stroke="#7A5530" stroke-width="2.5"/>
  <!-- Labels B -->
  <g font-size="13" fill="#1F2A44">
    <text x="512" y="126">Upper cage</text>
    <text x="512" y="142" fill="#5A6478" font-size="12">small mirror</text>
    <text x="512" y="156" fill="#5A6478" font-size="12">and eyepiece</text>
    <text x="500" y="246">Metal poles</text>
    <line x1="497" y1="242" x2="484" y2="242" stroke="#5A6478" stroke-width="1.2"/>
    <text x="512" y="345">Mirror box</text>
    <line x1="509" y1="341" x2="497" y2="341" stroke="#5A6478" stroke-width="1.2"/>
    <text x="318" y="228">Black cloth</text>
    <text x="318" y="244">shroud</text>
    <line x1="388" y1="236" x2="408" y2="236" stroke="#5A6478" stroke-width="1.2"/>
  </g>

  <!-- ===================== C: Truss tube, taken apart ===================== -->
  <!-- Mirror box in its rocker -->
  <rect x="645" y="330" width="90" height="112" fill="#E3E8F0" stroke="#1F2A44" stroke-width="2.5"/>
  <rect x="620" y="456" width="140" height="13" rx="3" fill="#C49A6C" stroke="#7A5530" stroke-width="2"/>
  <path d="M630 456 L630 380 L660 380 A30 30 0 0 0 720 380 L750 380 L750 456 Z" fill="#D9B382" stroke="#7A5530" stroke-width="2"/>
  <circle cx="690" cy="380" r="28" fill="#E9D3B0" stroke="#7A5530" stroke-width="2.5"/>
  <!-- Upper cage, set on the ground -->
  <rect x="790" y="435" width="80" height="34" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5"/>
  <rect x="787" y="431" width="86" height="9" rx="2" fill="#1F2A44"/>
  <!-- Bundle of poles -->
  <g stroke="#5A6478" stroke-width="4" stroke-linecap="round">
    <line x1="650" y1="480" x2="840" y2="480"/>
    <line x1="656" y1="486" x2="846" y2="486"/>
    <line x1="644" y1="492" x2="834" y2="492"/>
    <line x1="652" y1="498" x2="842" y2="498"/>
  </g>
  <!-- Folded shroud, on top of the cage -->
  <rect x="795" y="410" width="70" height="21" rx="6" fill="#3D475C"/>
  <g font-size="13" fill="#1F2A44">
    <text x="789" y="400">Cage + shroud</text>
    <text x="851" y="491">Poles</text>
    <text x="625" y="320">Mirror box</text>
  </g>

  <!-- Captions -->
  <g font-size="14" font-weight="700" fill="#2F6FDE">
    <text x="30" y="538">Simple but bulky</text>
    <text x="320" y="538">Same optics</text>
    <text x="620" y="538">Packs down for transport</text>
  </g>
  <g font-size="13" fill="#5A6478">
    <text x="30" y="558">Hard to store and to carry</text>
    <text x="320" y="558">Poles and cloth replace the tube</text>
    <text x="620" y="558">A few parts that fit in a car</text>
  </g>
</svg>
