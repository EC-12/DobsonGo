  <rect x="790" y="175" width="90" height="100" rx="10" fill="#DCE8FB" stroke="#2F6FDE" stroke-width="2.5"/>
  <text x="835" y="218" font-size="17" font-weight="700" fill="#1F2A44" text-anchor="middle">Alt/Az</text>
  <text x="835" y="238" font-size="12" fill="#1F2A44" text-anchor="middle">for the</text>
