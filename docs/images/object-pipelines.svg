  <rect x="440" y="292" width="175" height="56" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.8"/>
  <text x="527" y="317" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="middle">Kepler's equation</text>
