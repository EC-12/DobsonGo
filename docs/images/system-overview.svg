<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FDE"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="468" rx="16" fill="#F7F9FC" stroke="#D0D7E2" stroke-width="2"/>
  <text x="30" y="44" font-size="20" font-weight="700" fill="#1F2A44">How DobsonGo fits together</text>
  <text x="30" y="66" font-size="14" fill="#5A6478">Commands flow from the phone to the motors; the encoders report the real position back</text>

  <!-- ===================== Phone ===================== -->
  <rect x="30" y="120" width="130" height="240" rx="18" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5"/>
  <rect x="40" y="140" width="110" height="190" rx="6" fill="#1F2A44"/>
  <g fill="#FFFFFF">
    <circle cx="62" cy="165" r="1.6"/><circle cx="118" cy="158" r="1.2"/><circle cx="135" cy="190" r="1.8"/>
    <circle cx="70" cy="215" r="1.3"/><circle cx="58" cy="262" r="1.7"/><circle cx="128" cy="250" r="1.2"/>
    <circle cx="104" cy="182" r="1.1"/><circle cx="85" cy="280" r="1.4"/>
  </g>
  <circle cx="96" cy="222" r="3" fill="#E8A317"/>
  <circle cx="96" cy="222" r="14" fill="none" stroke="#E8A317" stroke-width="1.5"/>
  <line x1="96" y1="202" x2="96" y2="208" stroke="#E8A317" stroke-width="1.5"/>
  <line x1="96" y1="236" x2="96" y2="242" stroke="#E8A317" stroke-width="1.5"/>
  <line x1="76" y1="222" x2="82" y2="222" stroke="#E8A317" stroke-width="1.5"/>
  <line x1="110" y1="222" x2="116" y2="222" stroke="#E8A317" stroke-width="1.5"/>
  <rect x="55" y="298" width="80" height="22" rx="11" fill="#2F6FDE"/>
  <text x="95" y="313" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Track</text>
  <text x="95" y="385" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="middle">Android app</text>
  <text x="95" y="402" font-size="12" fill="#5A6478" text-anchor="middle">sky map + telescope menu</text>

  <!-- BLE link -->
  <line x1="162" y1="240" x2="298" y2="240" stroke="#2F6FDE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#blue)"/>
  <text x="230" y="230" font-size="12" font-weight="700" fill="#2F6FDE" text-anchor="middle">Bluetooth Low Energy</text>
  <text x="230" y="260" font-size="12" fill="#5A6478" text-anchor="middle">target coordinates</text>

  <!-- ===================== ESP32 ===================== -->
  <rect x="300" y="180" width="150" height="120" rx="10" fill="#DCE8FB" stroke="#2F6FDE" stroke-width="2.5"/>
  <text x="375" y="224" font-size="18" font-weight="700" fill="#1F2A44" text-anchor="middle">ESP32</text>
  <text x="375" y="246" font-size="12" fill="#1F2A44" text-anchor="middle">computes the moves,</text>
  <text x="375" y="263" font-size="12" fill="#1F2A44" text-anchor="middle">reads the encoders</text>

  <!-- Commands to the drivers -->
  <path d="M375 180 L375 140 L508 140" fill="none" stroke="#2F6FDE" stroke-width="2.5" marker-end="url(#blue)"/>
  <path d="M375 300 L375 340 L508 340" fill="none" stroke="#2F6FDE" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="392" y="131" font-size="12" fill="#2F6FDE">step commands</text>
  <text x="392" y="358" font-size="12" fill="#2F6FDE">step commands</text>

  <!-- ===================== Azimuth row ===================== -->
  <g font-size="13" fill="#1F2A44" text-anchor="middle">
    <rect x="510" y="115" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <text x="560" y="145">Driver</text>
    <rect x="650" y="115" width="110" height="50" rx="8" fill="#E3E8F0" stroke="#1F2A44" stroke-width="2"/>
    <text x="705" y="137" font-weight="700">NEMA 23</text>
    <text x="705" y="154" font-size="11" fill="#5A6478">stepper motor</text>
    <rect x="795" y="115" width="85" height="50" rx="8" fill="#D9B382" stroke="#7A5530" stroke-width="2"/>
    <text x="837" y="137" font-weight="700">Azimuth</text>
    <text x="837" y="154" font-size="11">axis</text>
  </g>
  <line x1="610" y1="140" x2="648" y2="140" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="760" y1="140" x2="793" y2="140" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <text x="777" y="131" font-size="11" fill="#5A6478" text-anchor="middle">gears</text>

  <!-- ===================== Altitude row ===================== -->
  <g font-size="13" fill="#1F2A44" text-anchor="middle">
    <rect x="510" y="315" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <text x="560" y="345">Driver</text>
    <rect x="650" y="315" width="110" height="50" rx="8" fill="#E3E8F0" stroke="#1F2A44" stroke-width="2"/>
    <text x="705" y="337" font-weight="700">NEMA 23</text>
    <text x="705" y="354" font-size="11" fill="#5A6478">stepper motor</text>
    <rect x="795" y="315" width="85" height="50" rx="8" fill="#D9B382" stroke="#7A5530" stroke-width="2"/>
    <text x="837" y="337" font-weight="700">Altitude</text>
    <text x="837" y="354" font-size="11">axis</text>
  </g>
  <line x1="610" y1="340" x2="648" y2="340" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="760" y1="340" x2="793" y2="340" stroke="#1F2A44" stroke-width="2" marker-end="url(#ink)"/>
  <text x="777" y="331" font-size="11" fill="#5A6478" text-anchor="middle">gears</text>

  <!-- ===================== Encoders ===================== -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="795" y="195" width="85" height="30" rx="6" fill="#2E9E6B"/>
    <text x="837" y="214">Encoder</text>
    <rect x="795" y="255" width="85" height="30" rx="6" fill="#2E9E6B"/>
    <text x="837" y="274">Encoder</text>
  </g>
  <line x1="837" y1="166" x2="837" y2="194" stroke="#2E9E6B" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="837" y1="286" x2="837" y2="314" stroke="#2E9E6B" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="795" y1="210" x2="452" y2="210" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#green)"/>
  <line x1="795" y1="270" x2="452" y2="270" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="622" y="202" font-size="12" fill="#2E9E6B">azimuth angle (SPI)</text>
  <text x="622" y="262" font-size="12" fill="#2E9E6B">altitude angle (SPI)</text>

  <!-- Legend -->
  <line x1="30" y1="440" x2="60" y2="440" stroke="#2F6FDE" stroke-width="2.5"/>
  <text x="68" y="444" font-size="13" fill="#1F2A44">commands</text>
  <line x1="160" y1="440" x2="190" y2="440" stroke="#2E9E6B" stroke-width="2.5"/>
  <text x="198" y="444" font-size="13" fill="#1F2A44">position measured on each axis</text>
</svg>
