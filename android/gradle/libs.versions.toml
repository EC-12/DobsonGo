[versions]
agp = "8.13.2"
#junit = "4.13.2"
#junitVersion = "1.3.0"
#espressoCore = "3.7.0"
#appcompat = "1.7.1"
#material = "1.13.0"
#constraintlayout = "2.2.1"
hipparchusCore = "4.0.2"
orekit = "13.1.3"
shadowhook = "2.0.0"
webkit = "1.16.0"

[libraries]
#junit = { group = "junit", name = "junit", version.ref = "junit" }
#ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
#espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
#appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
#material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
hipparchus-core = { module = "org.hipparchus:hipparchus-core", version.ref = "hipparchusCore" }
hipparchus-filtering = { module = "org.hipparchus:hipparchus-filtering", version.ref = "hipparchusCore" }
hipparchus-fitting = { module = "org.hipparchus:hipparchus-fitting", version.ref = "hipparchusCore" }
hipparchus-geometry = { module = "org.hipparchus:hipparchus-geometry", version.ref = "hipparchusCore" }
hipparchus-ode = { module = "org.hipparchus:hipparchus-ode", version.ref = "hipparchusCore" }
hipparchus-optim = { module = "org.hipparchus:hipparchus-optim", version.ref = "hipparchusCore" }
hipparchus-stat = { module = "org.hipparchus:hipparchus-stat", version.ref = "hipparchusCore" }
orekit = { module = "org.orekit:orekit", version.ref = "orekit" }
shadowhook = { module = "com.bytedance.android:shadowhook", version.ref = "shadowhook" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

